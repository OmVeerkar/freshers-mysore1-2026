<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowActive" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="45%" stop-color="#0E1738" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="goldGlow2">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="1130" fill="url(#bgGlowActive)" />
  <rect x="25" y="25" width="750" height="1080" rx="18" fill="none" stroke="url(#goldGrad2)" stroke-width="3" />
  <rect x="35" y="35" width="730" height="1060" rx="14" fill="none" stroke="url(#goldGrad2)" stroke-width="1" stroke-dasharray="5,5" opacity="0.6" />

  <!-- Badge -->
  <rect x="230" y="60" width="340" height="42" rx="21" fill="#1E1B4B" stroke="url(#goldGrad2)" stroke-width="1.5" />
  <text x="400" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#FDE68A" text-anchor="middle">
    OFFICIAL EVENT INVITATION
  </text>

  <!-- Title -->
  <text x="400" y="160" font-family="'Cinzel', serif" font-size="22" font-weight="700" letter-spacing="6" fill="#A855F7" text-anchor="middle">
    WELCOME TO COLLEGE LIFE
  </text>
  <text x="400" y="225" font-family="'Cinzel', serif" font-size="52" font-weight="900" letter-spacing="4" fill="url(#goldGrad2)" text-anchor="middle">
    FRESHERS BASH 2026
  </text>
  <text x="400" y="260" font-family="'Playfair Display', serif" font-style="italic" font-size="20" fill="#E2E8F0" text-anchor="middle">
    "A Night of Stars, Beats & Lifelong Memories"
  </text>

  <!-- Main Schedule & Highlights Box -->
  <rect x="70" y="300" width="660" height="520" rx="20" fill="#0B112C" stroke="#A855F7" stroke-width="1.5" />
  
  <text x="400" y="350" font-family="'Cinzel', serif" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="middle">
    CELEBRATION HIGHLIGHTS
  </text>
  <line x1="280" y1="365" x2="520" y2="365" stroke="url(#goldGrad2)" stroke-width="2" />

  <!-- Grid of Event Details -->
  <g transform="translate(100, 395)" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif">
    <!-- Item 1 -->
    <rect x="0" y="0" width="280" height="85" rx="12" fill="#1E1B4B" stroke="rgba(245,158,11,0.3)" />
    <text x="20" y="35" font-size="18" font-weight="700" fill="#FBBF24">🎧 DJ & DANCE FLOOR</text>
    <text x="20" y="62" font-size="13" fill="#94A3B8">Non-stop electronic beats & lights</text>

    <!-- Item 2 -->
    <rect x="320" y="0" width="280" height="85" rx="12" fill="#1E1B4B" stroke="rgba(245,158,11,0.3)" />
    <text x="340" y="35" font-size="18" font-weight="700" fill="#FBBF24">👑 MR. &amp; MS. FRESHER</text>
    <text x="340" y="62" font-size="13" fill="#94A3B8">Talent, runway &amp; grand crowning</text>

    <!-- Item 3 -->
    <rect x="0" y="105" width="280" height="85" rx="12" fill="#1E1B4B" stroke="rgba(245,158,11,0.3)" />
    <text x="20" y="140" font-size="18" font-weight="700" fill="#FBBF24">🎪 ICE-BREAKER GAMES</text>
    <text x="20" y="167" font-size="13" fill="#94A3B8">Exciting prizes and surprise gifts</text>

    <!-- Item 4 -->
    <rect x="320" y="105" width="280" height="85" rx="12" fill="#1E1B4B" stroke="rgba(245,158,11,0.3)" />
    <text x="340" y="140" font-size="18" font-weight="700" fill="#FBBF24">🍕 GRAND FEAST</text>
    <text x="340" y="167" font-size="13" fill="#94A3B8">Delicious buffet, snacks &amp; mocktails</text>

    <!-- Item 5 -->
    <rect x="0" y="210" width="280" height="85" rx="12" fill="#1E1B4B" stroke="rgba(245,158,11,0.3)" />
    <text x="20" y="245" font-size="18" font-weight="700" fill="#FBBF24">📸 360° GLAM BOOTH</text>
    <text x="20" y="272" font-size="13" fill="#94A3B8">Red carpet celebrity photo ops</text>

    <!-- Item 6 -->
    <rect x="320" y="210" width="280" height="85" rx="12" fill="#1E1B4B" stroke="rgba(245,158,11,0.3)" />
    <text x="340" y="245" font-size="18" font-weight="700" fill="#FBBF24">🎸 LIVE PERFORMANCES</text>
    <text x="340" y="272" font-size="13" fill="#94A3B8">College rock band &amp; dance crews</text>

    <!-- Schedule Note -->
    <rect x="0" y="315" width="600" height="75" rx="12" fill="#171033" stroke="#9333EA" />
    <text x="300" y="348" font-size="15" font-weight="700" fill="#E9D5FF" text-anchor="middle">📍 VENUE: MAIN COLLEGE AUDITORIUM</text>
    <text x="300" y="372" font-size="13" fill="#CBD5E1" text-anchor="middle">Dress Code: Glamour Evening / Smart Western • Entry via College ID</text>
  </g>

  <!-- Quote from Seniors -->
  <text x="400" y="875" font-family="'Playfair Display', serif" font-style="italic" font-size="20" fill="#FEF08A" text-anchor="middle">
    "New beginnings, endless memories – together we make college history!"
  </text>

  <!-- Footer Signoff -->
  <text x="400" y="940" font-family="'Cinzel', serif" font-size="22" font-weight="800" letter-spacing="4" fill="url(#goldGrad2)" text-anchor="middle">
    WITH LOVE, YOUR SENIORS ❤️
  </text>

  <!-- Small Footer -->
  <text x="400" y="990" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
    Keep this flyer saved on your phone. See you on the red carpet!
  </text>
</svg>
